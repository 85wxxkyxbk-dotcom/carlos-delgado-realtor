<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1714"/>
      <stop offset="100%" stop-color="#2b2722"/>
    </linearGradient>
    <radialGradient id="glow1" cx="18%" cy="20%" r="35%">
      <stop offset="0%" stop-color="#c9553a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c9553a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="82%" cy="78%" r="30%">
      <stop offset="0%" stop-color="#6f8977" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6f8977" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Top border accent -->
  <rect x="80" y="0" width="160" height="4" rx="2" fill="#c9553a"/>

  <!-- Brand mark circle -->
  <circle cx="80" cy="120" r="44" fill="#fbf8f1"/>
  <text x="80" y="133" font-family="Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#13110f" letter-spacing="1">CD</text>

  <!-- Kicker label -->
  <rect x="144" y="97" width="210" height="28" rx="14" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <circle cx="163" cy="111" r="5" fill="#6f8977"/>
  <text x="178" y="116" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="rgba(251,248,241,0.65)" letter-spacing="2">BILINGUAL REALTOR · MIAMI</text>

  <!-- Main headline -->
  <text x="80" y="240" font-family="Arial, sans-serif" font-size="96" font-weight="800" fill="#fbf8f1" letter-spacing="-4">Carlos Delgado</text>

  <!-- Subline -->
  <text x="80" y="316" font-family="Arial, sans-serif" font-size="40" font-weight="400" fill="rgba(251,248,241,0.62)" letter-spacing="-1">Real Estate · Miami</text>

  <!-- Divider line -->
  <rect x="80" y="366" width="64" height="3" rx="2" fill="#c9553a"/>

  <!-- Services row -->
  <text x="80" y="420" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="rgba(251,248,241,0.45)" letter-spacing="3">BUY  ·  SELL  ·  RENT  ·  INVEST</text>

  <!-- Value prop -->
  <text x="80" y="480" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="rgba(251,248,241,0.70)">Clear decisions. Organized process. Direct communication.</text>

  <!-- Domain pill -->
  <rect x="80" y="540" width="310" height="44" rx="22" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <text x="235" y="568" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="rgba(251,248,241,0.60)" letter-spacing="1.5">CARLOSDELGADOREALTY.COM</text>

  <!-- Terracotta accent right -->
  <rect x="1080" y="0" width="120" height="630" fill="#c9553a" opacity="0.06"/>
  <text x="1140" y="340" font-family="Arial, sans-serif" font-size="120" font-weight="800" text-anchor="middle" fill="rgba(251,248,241,0.04)" transform="rotate(-90,1140,340)" letter-spacing="-4">MIAMI</text>
</svg>
